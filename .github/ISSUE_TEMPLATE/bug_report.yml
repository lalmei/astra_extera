name: Bug report
description: Report a bug or issue with AstraExtera.
title: "🐛 BUG: "
labels: ["bug"]

body:
  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: What AstraExtera version were you using?
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: astraterra-version
    attributes:
      label: AstraTerra Version
      description: What version of the required AstraTerra mod were you using?
      placeholder: v0.10.0
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game Version
      description: What Vintage Story version were you using?
      placeholder: v1.22.2
    validations:
      required: true
  - type: dropdown
    id: operating-systems
    attributes:
      label: Platform
      description: Select your operating system.
      options:
        - Windows
        - Mac
        - Linux
    validations:
      required: true
  - type: dropdown
    id: playmode
    attributes:
      label: SP/MP
      description: Were you playing singleplayer or multiplayer?
      options:
        - Singleplayer
        - Multiplayer
    validations:
      required: true
  - type: textarea
    id: cosmology
    attributes:
      label: Cosmology
      description: Paste the output of /astraextera galaxy, or the cosmology seed, if relevant. Mention whether you used /astraextera reroll.
      placeholder: Paste the galaxy details here.
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected instead.
      placeholder: Describe the bug or issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Explain how this bug or issue can be reproduced.
      placeholder: "1. Load a world with ... 2. Use ... 3. Observe ..."
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach a screenshot if it helps explain the issue or shows a visual bug.
      placeholder: Drag and drop pictures here.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach client-main.log and server-main.log from the game's Logs folder, along with a crash log if available. For large logs, link a gist.github.com upload.
      placeholder: Paste relevant logs here, or drag and drop log files.
    validations:
      required: false
